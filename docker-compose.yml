services:
  postgres:
    image: postgres:16-alpine
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar_db
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - northstar-network

  redis:
    image: redis:7-alpine
    container_name: northstar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - northstar-network

  adminer:
    image: adminer:latest
    container_name: northstar-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - northstar-network

volumes:
  postgres_data:
  redis_data:

networks:
  northstar-network:
    driver: bridge

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: northstar-backend

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:northstar_db}?currentSchema=public
    username: ${DB_USER:northstar}
    password: ${DB_PASSWORD:northstar_dev_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: technical,catalog,inventory,orders,payments,fulfillment,returns,customer,cart,cms
    default-schema: technical
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
